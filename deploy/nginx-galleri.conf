# Place this file at /etc/nginx/sites-available/galleri
# then: ln -s /etc/nginx/sites-available/galleri /etc/nginx/sites-enabled/galleri

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name galleri.adamrose.dk;

    ssl_certificate     /etc/ssl/adamrose.dk.pem;
    ssl_certificate_key /etc/ssl/adamrose.dk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options           "DENY"              always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header Referrer-Policy           "strict-origin"     always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' https://adamjhr-storage.ams3.cdn.digitaloceanspaces.com; script-src 'self'; style-src 'self'; connect-src 'self';" always;
    add_header Access-Control-Allow-Origin "https://galleri.adamrose.dk" always;

    client_max_body_size 22M;

    proxy_request_buffering  on;
    proxy_buffer_size        16k;
    proxy_buffers            8 32k;
    proxy_busy_buffers_size  64k;
    proxy_temp_file_write_size 64k;
    client_body_buffer_size  1m;
    proxy_read_timeout       120s;
    proxy_send_timeout       120s;

    # Internal subrequest to Authelia — Nginx calls this for every request
    # before forwarding to Gunicorn. Returns 200 (allow) or 401/403 (deny).
    location /authelia {
        internal;
        proxy_pass                  http://127.0.0.1:9091/api/verify;
        proxy_pass_request_body     off;
        proxy_set_header Content-Length "";
        proxy_set_header Host                   $host;
        proxy_set_header X-Original-URL         $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Method     $request_method;
        proxy_set_header X-Forwarded-Proto      $scheme;
        proxy_set_header X-Forwarded-Host       $http_host;
        proxy_set_header X-Forwarded-URI        $request_uri;
        proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP              $remote_addr;
    }

    # When Authelia returns 401, redirect the browser to the login portal.
    error_page 401 =302 https://auth.adamrose.dk/?rd=$scheme://$http_host$request_uri;

    location / {
        # Gate every request through Authelia
        auth_request /authelia;

        # Forward the identity headers Authelia sets on a successful auth
        auth_request_set $user        $upstream_http_remote_user;
        auth_request_set $groups      $upstream_http_remote_groups;
        auth_request_set $name        $upstream_http_remote_name;
        auth_request_set $email       $upstream_http_remote_email;

        proxy_set_header Remote-User    $user;
        proxy_set_header Remote-Groups  $groups;
        proxy_set_header Remote-Name    $name;
        proxy_set_header Remote-Email   $email;

        proxy_pass http://unix:/run/galleri/galleri.sock;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name galleri.adamrose.dk;
    return 301 https://$host$request_uri;
}

# Place this file at /etc/nginx/sites-available/galleri
# then: ln -s /etc/nginx/sites-available/galleri /etc/nginx/sites-enabled/galleri

# Rate-limit zone for auth endpoints (10 req/min per IP)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adamrose.dk;

    ssl_certificate     /etc/ssl/adamrose.dk.pem;
    ssl_certificate_key /etc/ssl/adamrose.dk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options           "DENY"              always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header Referrer-Policy           "strict-origin"     always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' https://adamjhr-storage.ams3.cdn.digitaloceanspaces.com; script-src 'self'; style-src 'self'; connect-src 'self';" always;

    # Max upload size (slightly above app limit to allow multipart overhead)
    client_max_body_size 22M;

    # Rate-limit auth endpoints
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://unix:/run/galleri/galleri.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://unix:/run/galleri/galleri.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name adamrose.dk;
    return 301 https://$host$request_uri;
}

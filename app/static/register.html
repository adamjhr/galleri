<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleri — Register</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Galleri</h1>
    <h2>Create account</h2>

    <form id="register-form">
      <label for="invite_token">Invite token</label>
      <input id="invite_token" type="text" required>

      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" required minlength="8">

      <button type="submit">Create account</button>
      <p id="reg-error" class="error hidden"></p>
      <p id="reg-success" class="success hidden"></p>
    </form>

    <p class="auth-footer"><a href="/login.html">Back to login</a></p>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>

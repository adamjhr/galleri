<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleri — Admin</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">Galleri</a>
    <nav>
      <span>Admin</span>
      <button id="logout-btn">Log out</button>
    </nav>
  </header>

  <main class="admin-main">
    <section>
      <h2>Users</h2>
      <p class="hint">Users are managed in Authelia's <code>users_database.yml</code> on the server.</p>
      <table id="users-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Admin</th>
            <th>Joined</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
